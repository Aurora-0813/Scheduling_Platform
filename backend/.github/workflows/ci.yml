# ============================================================================
# 后端 CI（项目文档 8.7）
# ----------------------------------------------------------------------------
# 触发：推送到 main / develop，以及面向这两个分支的 PR。
#
# ⚠️ 关于文件位置（重要，别踩坑）
# ----------------------------------------------------------------------------
# 本仓库当前定位是「将来并入 monorepo 的 backend/ 子目录」，因此本文件放在
# backend/.github/workflows/ci.yml。**GitHub Actions 只认仓库根目录下的
# .github/workflows/**，所以本文件现在不会执行** —— 它是一份随时可用的成品，
# 等目录合并进 monorepo 时按下面二选一处理：
#   a) 把本文件移动到仓库根的 .github/workflows/backend-ci.yml（推荐），
#      并把下面的 checkout/setup-python 加 `working-directory` 或 `defaults.run`；
#   b) 如果 backend/ 自己就是仓库根（即本仓库直接被当作后端仓库使用），
#      什么都不用改，本文件立刻生效。
#
# ⚠️ 为什么 CI 里不需要 .env、也不需要云库和 Redis
# ----------------------------------------------------------------------------
# 测试全部离线（决策见 docs/test.md）：SQLite 临时文件库 + 假 Redis +
# 内存令牌白名单，`tests/conftest.py` 在导入 app 之前就把 REDIS_ENABLED
# 等环境变量设好了，缺 `.env` 时 app.core.config 走默认值。
# 因此 CI **不需要**配置任何密钥 —— 这也意味着 CI 里跑不到真库，
# 真库联调仍按 docs/deploy.md 的步骤在隧道里由人执行。
# ============================================================================
name: 后端 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 允许手动触发（答辩前想确认一下流水线是否还是绿的）
  workflow_dispatch:

# 同一分支连续推送时取消上一次未跑完的任务，避免排队浪费
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.11.9
        uses: actions/setup-python@v7
        with:
          # 与 conda 环境 smart_dev 保持一致（项目文档 3.6）
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: 安装依赖（按全量锁定版本）
        # 用 requirements.lock 而不是 requirements.txt：CI 必须与本地
        # 完全一致的间接依赖版本，否则会出现「本地过、CI 挂」的幽灵问题。
        run: pip install -r requirements.lock

      - name: 安装开发工具
        # ruff / pre-commit 是**开发工具**，不属于项目文档 3.6 的运行期依赖，
        # 因此不写进 requirements.txt。两处版本号必须与
        # .pre-commit-config.yaml 中的 rev 一致，否则本地与 CI 的规则集会漂移。
        run: pip install ruff==0.16.9 pre-commit==4.6.2

      - name: ruff 检查
        run: ruff check --output-format=github .

      - name: ruff 格式检查
        # 只检查不改：CI 里改文件没有意义，需要格式化时本地跑 ruff format
        run: ruff format --check .

      - name: 检查是否误提交了凭证文件
        # 只跑这一条本地钩子（language: fail，不需要联网下载钩子仓库）。
        # 这是 CI 里最有价值的一项：`.env` 一旦进过历史，密钥就必须更换。
        run: pre-commit run no-secrets-file --all-files

      - name: 运行测试
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率报告
        # if: always() —— 测试失败时覆盖率报告更有排查价值
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

# ============================================================================
# 前端 / 小程序的流水线（暂时不在本仓库）
# ----------------------------------------------------------------------------
# 项目文档 8.7 要求 PR 时也跑 `npm run lint` 与 `npm run build`。
# 前端与小程序当前是各自的仓库（见 8.5 的目录结构），本目录里没有
# package.json，硬加一个前端 job 只会每次失败。合入 monorepo 后按下面的
# 形式补一个并列的 job，并把缓存目录指向 frontend/package-lock.json：
