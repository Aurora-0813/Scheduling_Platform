; ============================================================================
; pytest 配置（规范 §3.7）
; ============================================================================
; 关键：asyncio_mode = auto
;   不配置它的话，`async def` 的测试函数会被 pytest 当成普通同步函数，
;   结果是「不报错但也没真的执行」—— 这是最容易踩的坑，务必保留。
; ============================================================================

[pytest]
asyncio_mode = auto
# 全部异步用例跑在**同一个事件循环**里（默认是每条用例一个新循环）。
# **不要改成 function**：`asyncmy` 的连接与创建它的那个事件循环绑定，
# 连接池又是进程级的——每条用例换循环时，池里那条旧连接仍指向已关闭的 loop，
# 表现为 `AttributeError: 'NoneType' object has no attribute 'send'`
# 包成 `asyncmy.errors.InternalError: network operation failed`，
# 且**只在复用池化连接的用例上偶发**，看起来像「数据库不稳定」。
#
# （2026-09-28 合并 origin/main 时的取舍：正式版写的是
#  `asyncio_default_fixture_loop_scope = function`。这里保留 session ——
#  上面描述的不是理论风险，是模块 4 阶段 7 实测踩到并定位过的真实报错。）
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; 测试从 backend/ 根导入 `app.*`。
; **不要删这两行**：直接跑 `pytest`（而非 `python -m pytest`）时，cwd 不在 sys.path 上，
; 没有它连 `import app` 都会失败。
pythonpath = .

; `-m "not smoke"`：默认跳过联网冒烟用例（会真实消耗大模型 / ASR API 额度）。
;   需要时显式执行：pytest -m smoke
; `--strict-markers`：markers 里没登记的标记直接报错，防止打错标签被静默忽略。
;
; 覆盖率阈值（阶段 7 任务 7-8 要求写进本文件，而不是只在命令行上带一次）。
; 范围限定 `app.agent`：这是模块 4 的交付物。**不要放宽到整个 `app`**——
; 分母里混进模块 3 的桩、模块 1 的认证等他人代码，阈值会变得没有意义。
; 单独跑某个文件时会因为达不到阈值而失败，属预期行为：要临时绕过用 `--no-cov`。
;
; 两套 addopts 合并成一条：ini 里 `addopts` 是单值键，写两遍只有最后一条生效。
addopts =
    -q
    --strict-markers
    -m "not smoke"
    --cov=app.agent
    --cov-report=term-missing
    --cov-fail-under=80

markers =
    unit: 纯逻辑单元测试，不涉及数据库与网络
    api: 通过 ASGI 客户端调用的接口测试，使用 SQLite 内存库与假 Redis
    db: 直接驱动数据库会话依赖（get_db / 事务边界）的契约测试，不经过 HTTP
    migrations: 通过 subprocess 驱动 alembic 的迁移测试，落在临时 SQLite 库上，不需要云库
    integration: 需要真实外部依赖（云库 / Redis）的集成测试，默认跳过
    smoke: 需要真实调用外部大模型 / ASR API 的冒烟用例（模块 1/2），默认跳过

; 日志：需要观察降级路径时可临时把 log_cli 改成 true
log_cli = false
log_level = INFO
