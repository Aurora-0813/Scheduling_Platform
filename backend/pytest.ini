; ============================================================================
; pytest 配置（规范 §3.7）
; ============================================================================
; 关键：asyncio_mode = auto
;   不配置它的话，`async def` 的测试函数会被 pytest 当成普通同步函数，
;   结果是「不报错但也没真的执行」—— 这是最容易踩的坑，务必保留。
; ============================================================================

[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; 默认跳过联网冒烟用例（会真实消耗外部 API 额度）。
; ⚠️ 两个标记都要排除，只排一个会让另一半真调外部服务：
;   smoke : main 的联网用例（真实视觉模型 / 百度 ASR）
;   live  : 模块 7 的真实大模型用例
; 想单独跑真实用例：命令行 -m 覆盖 addopts 里的 -m，直接指定标记即可
;   pytest -m smoke -v
;   pytest -m live  -v        （另需 RUN_LIVE_LLM=1，参见 tests/test_live_smoke.py）
addopts = -m "not smoke and not live" -v

markers =
    smoke: 需要真实调用外部大模型 API 的冒烟用例，默认跳过
    live: 真实大模型 API 冒烟用例，默认跳过，需 RUN_LIVE_LLM=1 显式启用

; 日志：需要观察降级路径时可临时把 log_cli 改成 true
log_cli = false
log_level = INFO
