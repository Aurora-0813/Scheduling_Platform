[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio 1.x 起要求显式声明 fixture 的事件循环作用域，
# 未设置会发出弃用告警。
asyncio_default_fixture_loop_scope = function

; 测试从 backend/ 根导入 `app.*`。
; **不要删这两行**：直接跑 `pytest`（而非 `python -m pytest`）时，cwd 不在 sys.path 上，
; 没有它连 `import app` 都会失败。
pythonpath = .

# `-m "not smoke"`：默认排除需要真实外部依赖的冒烟用例。
# 模块 1/2 的 smoke 用例会真实调用百度 ASR / DeepSeek / 视觉模型，消耗额度，
# 因此默认不跑；需要时显式执行：pytest -m smoke
# `--strict-markers`：markers 里没登记的标记直接报错，防止打错标签被静默忽略。
addopts = -q --strict-markers -m "not smoke"

markers =
    unit: 纯逻辑单元测试，不涉及数据库与网络
    api: 通过 ASGI 客户端调用的接口测试，使用 SQLite 内存库与假 Redis
    db: 直接驱动数据库会话依赖（get_db / 事务边界）的契约测试，不经过 HTTP
    migrations: 通过 subprocess 驱动 alembic 的迁移测试，落在临时 SQLite 库上，不需要云库
    integration: 需要真实外部依赖（云库 / Redis）的集成测试，默认跳过
    smoke: 需要真实调用外部大模型 / ASR API 的冒烟用例（模块 1/2），默认跳过
