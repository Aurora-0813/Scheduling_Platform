; ============================================================================
; pytest 配置（规范 §3.7）
; ============================================================================
; 关键：asyncio_mode = auto
;   不配置它的话，`async def` 的测试函数会被 pytest 当成普通同步函数，
;   结果是「不报错但也没真的执行」—— 这是最容易踩的坑，务必保留。
; ============================================================================

[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; 默认跳过联网冒烟用例（会真实消耗大模型 API 额度）。
; 需要时显式执行：pytest -m smoke
addopts = -m "not smoke" -v

markers =
    smoke: 需要真实调用外部大模型 API 的冒烟用例，默认跳过

; 日志：需要观察降级路径时可临时把 log_cli 改成 true
log_cli = false
log_level = INFO
