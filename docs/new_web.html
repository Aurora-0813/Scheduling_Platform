<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AI 全感知·智能空间与设备综合调度平台 — 前端页面原型</title>
<style>
  :root{
    --primary:#409EFF; --primary-d:#2a7fd4;
    --ai-a:#409EFF; --ai-b:#7c5cff;          /* AI 专属渐变 */
    --ai-soft:#eef4ff; --ai-line:#d6e4ff;
    --success:#67C23A; --warning:#E6A23C; --danger:#F56C6C;
    --t1:#303133; --t2:#606266; --t3:#909399;
    --bd:#DCDFE6; --bd-l:#EBEEF5; --bg:#F5F7FA;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;
       background:#e8ecf2;color:var(--t1);padding:28px 32px 72px;}
  .page-title{font-size:20px;font-weight:700;}
  .page-sub{font-size:13px;color:var(--t3);margin:6px 0 24px;}
  .group-title{font-size:14px;font-weight:600;color:#46536b;margin:30px 0 15px;
    padding-left:11px;border-left:3px solid;border-image:linear-gradient(180deg,#409EFF,#7c5cff) 1;}
  .gallery{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start;}
  figure{display:flex;flex-direction:column;gap:9px;}
  figcaption{font-size:12.5px;color:#5b6880;text-align:center;}
  .frame{overflow:hidden;background:#fff;}
  .frame.pc{width:720px;height:450px;border-radius:10px;
    box-shadow:0 10px 28px rgba(23,42,74,.16);}
  .frame.mb{width:234px;height:507px;border-radius:26px;
    box-shadow:0 12px 30px rgba(23,42,74,.22);}
  .screen{transform-origin:top left;position:relative;background:#fff;}
  .screen.pc{width:1440px;height:900px;transform:scale(.5);}
  .screen.mb{width:390px;height:844px;transform:scale(.6);
    display:flex;flex-direction:column;background:var(--bg);font-size:14px;color:var(--t1);}

  /* ================= 动效 ================= */
  @keyframes breathe{0%,100%{opacity:.45;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
  @keyframes scanY{0%{top:-12%}100%{top:112%}}
  @keyframes scanX{0%{left:-24%}100%{left:124%}}
  @keyframes stepIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  @keyframes flowY{0%{background-position:0 0}100%{background-position:0 40px}}
  @keyframes gradientMove{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes wv{0%,100%{transform:scaleY(.26)}50%{transform:scaleY(1)}}
  @keyframes ring{0%{transform:scale(.7);opacity:.85}100%{transform:scale(1.9);opacity:0}}
  @keyframes dashIn{from{stroke-dasharray:0 100}to{stroke-dasharray:88 100}}

  .live{width:7px;height:7px;border-radius:50%;background:var(--success);
    display:inline-block;animation:breathe 1.8s ease-in-out infinite;}
  .live.b{background:var(--primary);}
  .caret::after{content:"▌";color:var(--primary);animation:blink 1s step-end infinite;
    margin-left:1px;font-weight:400;}

  /* ================= PC 布局 ================= */
  .layout{display:flex;height:100%;}
  .side{width:216px;flex:none;background:#fff;border-right:1px solid var(--bd-l);
    padding:16px 0;display:flex;flex-direction:column;}
  .logo{display:flex;align-items:center;gap:9px;padding:0 18px 16px;
    border-bottom:1px solid var(--bd-l);font-size:14.5px;font-weight:700;color:var(--t1);}
  .logo i{width:27px;height:27px;border-radius:8px;font-style:normal;font-size:14px;
    display:flex;align-items:center;justify-content:center;color:#fff;
    background:linear-gradient(135deg,var(--ai-a),var(--ai-b));
    box-shadow:0 3px 10px rgba(64,158,255,.35);}
  .navwrap{flex:1;padding-top:8px;}
  .si{display:flex;align-items:center;gap:10px;padding:10px 18px;font-size:13px;color:var(--t2);}
  .si.on{color:var(--primary);font-weight:600;background:var(--ai-soft);
    box-shadow:inset 3px 0 0 var(--primary);}
  .side-foot{padding:12px 14px;border-top:1px solid var(--bd-l);}
  .aibox{background:linear-gradient(135deg,#f2f7ff,#f6f2ff);border:1px solid var(--ai-line);
    border-radius:9px;padding:10px 11px;font-size:11.5px;color:var(--t2);line-height:1.6;}
  .aibox b{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t1);
    margin-bottom:5px;}

  .body{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
  .head{height:56px;flex:none;background:#fff;border-bottom:1px solid var(--bd-l);
    display:flex;align-items:center;gap:12px;padding:0 22px;font-size:13px;color:var(--t3);}
  .grow{flex:1}
  .avatar{width:29px;height:29px;border-radius:50%;color:#fff;font-size:12px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--ai-a),var(--ai-b));}
  .main{flex:1;padding:16px 22px;min-height:0;overflow:hidden;}

  .pagebar{display:flex;align-items:center;margin-bottom:14px;}
  .pagebar h3{font-size:17px;}
  .pagebar .acts{margin-left:auto;display:flex;gap:8px;}

  .btn{border:none;border-radius:6px;padding:8px 14px;font-size:12.5px;font-family:inherit;
    color:#fff;cursor:pointer;background:var(--primary);}
  .btn.ghost{background:#fff;border:1px solid var(--bd);color:var(--t2);}
  .btn.sm{padding:5px 11px;font-size:12px;}
  .btn.ai{background:linear-gradient(135deg,var(--ai-a),var(--ai-b));
    box-shadow:0 3px 12px rgba(64,158,255,.32);}
  .btn.block{display:block;width:100%;padding:11px;font-size:13.5px;text-align:center;
    border-radius:8px;}

  .card{background:#fff;border:1px solid var(--bd-l);border-radius:8px;padding:15px 17px;}
  .cardhead{display:flex;align-items:center;font-size:12.5px;color:var(--t3);margin-bottom:13px;}
  .cardhead b{font-size:13.5px;color:var(--t1);font-weight:600;}

  .tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;line-height:16px;}
  .tag.blue{background:#ecf5ff;color:#409EFF;}
  .tag.purple{background:#f2eefc;color:#7c5cff;}
  .tag.green{background:#f0f9eb;color:#67C23A;}
  .tag.orange{background:#fdf6ec;color:#E6A23C;}
  .tag.red{background:#fef0f0;color:#F56C6C;}
  .tag.gray{background:#f4f4f5;color:#909399;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{background:#fafafa;color:#909399;font-weight:500;text-align:left;
     padding:10px 12px;border-bottom:1px solid var(--bd-l);}
  td{padding:11px 12px;border-bottom:1px solid #f5f7fa;color:var(--t2);}
  .pager{display:flex;justify-content:flex-end;gap:8px;font-size:12px;color:var(--t3);padding-top:13px;}
  .pager span{display:inline-flex;width:24px;height:24px;border-radius:4px;align-items:center;
    justify-content:center;border:1px solid var(--bd);}
  .pager span.on{background:var(--primary);color:#fff;border-color:var(--primary);}
  .filters{display:flex;gap:10px;margin-bottom:13px;}
  .filters .input,.filters .select{background:#fff;border:1px solid var(--bd);border-radius:6px;
    padding:8px 12px;font-size:12.5px;color:var(--t3);}
  .filters .input{width:232px;}
  .tabs{display:flex;gap:26px;border-bottom:1px solid #e9ecf2;margin-bottom:13px;}
  .tab{font-size:13.5px;color:var(--t2);padding:0 2px 11px;position:relative;}
  .tab.on{color:var(--primary);font-weight:600;}
  .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;
    background:var(--primary);border-radius:2px;}

  /* AI 提示条 */
  .aibar{display:flex;align-items:center;gap:11px;padding:11px 15px;margin-bottom:14px;
    border-radius:8px;font-size:12.5px;color:var(--t2);
    background:linear-gradient(90deg,#eef5ff,#f5f1ff 60%,#fff);
    border:1px solid var(--ai-line);position:relative;overflow:hidden;}
  .aibar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--ai-a),var(--ai-b));}
  .aibar .ic{width:24px;height:24px;flex:none;border-radius:7px;font-size:12px;color:#fff;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--ai-a),var(--ai-b));}
  .aibar b{color:var(--t1);}

  /* ---------- 登录 ---------- */
  .login{display:flex;height:100%;}
  .login-l{flex:1.15;position:relative;overflow:hidden;padding:74px 68px;color:#fff;
    display:flex;flex-direction:column;justify-content:center;
    background:linear-gradient(145deg,#2d6fd0,#409EFF 45%,#7c5cff);}
  .login-l .dotgrid{position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(circle,rgba(255,255,255,.5) 1px,transparent 1px);
    background-size:34px 34px;
    mask-image:radial-gradient(620px 460px at 45% 45%,#000 15%,transparent 72%);
    -webkit-mask-image:radial-gradient(620px 460px at 45% 45%,#000 15%,transparent 72%);}
  .login-l .orb{position:absolute;border-radius:50%;filter:blur(60px);}
  .login-l .orb.a{width:300px;height:300px;background:rgba(255,255,255,.35);top:-70px;right:-50px;
    animation:breathe 7s ease-in-out infinite;}
  .login-l .orb.b{width:280px;height:280px;background:rgba(124,92,255,.55);bottom:-90px;left:-60px;
    animation:breathe 9s ease-in-out infinite reverse;}
  .login-l .inner{position:relative;z-index:2;}
  .ll-badge{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;
    padding:6px 13px;border-radius:20px;margin-bottom:24px;width:fit-content;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.42);}
  .login-l h2{font-size:32px;line-height:1.45;font-weight:700;margin-bottom:14px;letter-spacing:.4px;}
  .login-l .sub{font-size:13.5px;color:rgba(255,255,255,.82);line-height:1.9;margin-bottom:34px;}
  .ll-feat{display:flex;flex-direction:column;gap:13px;}
  .ll-feat div{display:flex;align-items:center;gap:11px;font-size:13px;color:rgba(255,255,255,.94);}
  .ll-feat i{width:29px;height:29px;border-radius:9px;font-style:normal;font-size:14px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.36);}
  .login-r{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 88px;
    background:#fff;}
  .login-r h3{font-size:23px;margin-bottom:8px;}
  .login-r .hint{font-size:12.5px;color:var(--t3);margin-bottom:30px;line-height:1.7;}
  .field{margin-bottom:19px;}
  .field label{display:block;font-size:12.5px;color:var(--t2);margin-bottom:8px;}
  .inputx{border:1px solid var(--bd);border-radius:7px;padding:11px 14px;
    font-size:13.5px;color:var(--t1);background:#fff;}
  .inputx.ph{color:#c0c4cc;}
  .inputx.focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(64,158,255,.12);}

  /* ---------- Agent 工作台 ---------- */
  .agentgrid{display:flex;gap:14px;height:calc(100% - 52px);}
  .agcol{display:flex;flex-direction:column;gap:13px;min-width:0;}

  .ask{background:linear-gradient(135deg,#eff5ff,#f7f3ff);
    border:1px solid var(--ai-line);border-radius:10px;padding:13px 15px;font-size:13px;
    line-height:1.95;color:var(--t1);position:relative;overflow:hidden;}
  .ask::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--ai-a),var(--ai-b));}
  .ask .who{font-size:11.5px;color:#7a93b5;margin-bottom:8px;display:flex;align-items:center;gap:7px;}
  .ent{padding:1px 5px;border-radius:4px;font-weight:600;}
  .ent.t{background:#e2f1ff;color:#2a7fd4;}
  .ent.n{background:#e6f8ec;color:#3d9a34;}
  .ent.d{background:#fdf0dd;color:#c47b16;}
  .ent.b{background:#f7e9f8;color:#a44fc0;}

  /* 思考链 */
  .trace{display:flex;flex-direction:column;}
  .tstep{display:flex;gap:12px;padding-bottom:14px;position:relative;
    opacity:0;animation:stepIn .5s ease both;}
  .tstep::before{content:"";position:absolute;left:11.5px;top:25px;bottom:0;width:1.5px;
    background:linear-gradient(180deg,#bfd9ff,#e4ecfa);}
  .tstep:last-child::before{display:none;}
  .tnum{width:24px;height:24px;flex:none;border-radius:50%;font-size:11px;font-weight:700;
    color:#fff;display:flex;align-items:center;justify-content:center;z-index:1;
    background:linear-gradient(135deg,var(--ai-a),var(--ai-b));
    box-shadow:0 0 0 3px #eaf2ff;}
  .tnum.g{background:linear-gradient(135deg,#67C23A,#3d9a34);box-shadow:0 0 0 3px #eaf7e6;}
  .tnum.o{background:linear-gradient(135deg,#E6A23C,#d18a1f);box-shadow:0 0 0 3px #fdf3e4;}
  .tb{flex:1;min-width:0;padding-top:1px;}
  .tb h5{font-size:12.5px;margin-bottom:5px;display:flex;align-items:center;gap:7px;}
  .tb p{font-size:12px;color:var(--t3);line-height:1.7;}
  .code{background:#f7f9fc;border:1px solid #e9eef6;border-radius:6px;padding:7px 10px;
    font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#4a6a92;
    margin-top:6px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* 方案卡 */
  .planbox{border-radius:10px;padding:15px 17px;position:relative;overflow:hidden;
    background:linear-gradient(140deg,#eef5ff,#f5f0ff);
    border:1px solid var(--ai-line);}
  .planbox::after{content:"";position:absolute;top:-60%;left:-40%;width:60%;height:220%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
    transform:rotate(20deg);animation:scanX 4.4s ease-in-out infinite;}
  .planbox h4{font-size:14.5px;margin-bottom:9px;position:relative;z-index:2;}
  .planbox .line{font-size:12.5px;color:var(--t2);line-height:1.95;position:relative;z-index:2;}
  .planbox .price{font-size:23px;font-weight:700;margin-top:9px;position:relative;z-index:2;
    background:linear-gradient(90deg,#2a7fd4,#7c5cff);-webkit-background-clip:text;
    background-clip:text;color:transparent;}

  .ringwrap{display:flex;align-items:center;gap:14px;}
  .ringwrap svg{width:62px;height:62px;flex:none;}
  .ringwrap .rc{font-size:12px;color:var(--t3);line-height:1.75;}
  .ringwrap .rc b{display:block;font-size:17px;color:var(--t1);}

  /* ---------- 日历 ---------- */
  .calwrap{display:flex;gap:14px;height:calc(100% - 52px);}
  .calcard{flex:1;display:flex;flex-direction:column;min-width:0;}
  .cal{display:flex;flex-direction:column;flex:1;min-height:0;font-size:11.5px;}
  .calrow{display:flex;border-bottom:1px solid var(--bd-l);}
  .calrow .tcol{width:60px;flex:none;}
  .calrow .dcol{flex:1;text-align:center;padding:9px 0;color:var(--t2);
    border-left:1px solid #f2f5f9;}
  .calbody{display:flex;flex:1;min-height:0;}
  .calbody .tcol{width:60px;flex:none;color:var(--t3);}
  .calbody .tcol div{height:42px;text-align:right;padding-right:9px;font-size:11px;}
  .calbody .dcol{flex:1;border-left:1px solid #f2f5f9;position:relative;}
  .calbody .dcol .cell{height:42px;border-bottom:1px solid #f7f9fc;}
  .ev{position:absolute;left:4px;right:4px;border-radius:6px;padding:5px 7px;font-size:10.5px;
    line-height:1.35;color:#fff;overflow:hidden;}
  .ev.blue{background:#409EFF;}
  .ev.purple{background:#7c5cff;}
  .ev.green{background:#67C23A;}
  .ev.orange{background:#E6A23C;}
  .ev.red{background:#F56C6C;animation:breathe 2.2s ease-in-out infinite;}
  .ev.ai{background:linear-gradient(135deg,#409EFF,#7c5cff);
    border:1px dashed rgba(255,255,255,.85);}

  .witem{border-left:3px solid var(--warning);background:#fffaf1;border-radius:0 7px 7px 0;
    padding:10px 12px;margin-bottom:10px;font-size:12px;color:var(--t2);}
  .witem b{display:block;font-size:12.5px;color:var(--t1);margin-bottom:5px;}
  .witem p{font-size:11.5px;color:var(--t3);line-height:1.55;margin-bottom:7px;}
  .witem.red{border-left-color:var(--danger);background:#fef6f6;}
  .witem.blue{border-left-color:var(--primary);background:#f2f8ff;}

  /* 雷达 */
  .radar{width:96px;height:96px;margin:2px auto 12px;position:relative;border-radius:50%;
    background:radial-gradient(circle,#f4f9ff,#eef4ff);
    border:1px solid var(--ai-line);}
  .radar i{position:absolute;border-radius:50%;border:1px solid #dbe8fa;}
  .radar i:nth-child(1){inset:0;}
  .radar i:nth-child(2){inset:20%;}
  .radar i:nth-child(3){inset:40%;}
  .radar .sweep{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg,rgba(64,158,255,.45),transparent 24%);
    animation:spinSlow 2.8s linear infinite;}
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  .radar .ping{position:absolute;inset:0;border-radius:50%;border:1.5px solid var(--primary);
    animation:ring 2.2s ease-out infinite;}

  /* ---------- 数据看板 ---------- */
  .kpis{display:flex;gap:13px;margin-bottom:15px;}
  .kpi{flex:1;background:#fff;border:1px solid var(--bd-l);border-radius:8px;padding:15px 17px;}
  .kpi .k{font-size:12.5px;color:var(--t3);margin-bottom:10px;}
  .kpi .v{font-size:26px;font-weight:700;}
  .kpi .v small{font-size:13px;font-weight:400;color:var(--t3);margin-left:3px;}
  .kpi .d{font-size:11.5px;margin-top:8px;color:var(--success);}
  .kpi .d.down{color:var(--warning);}
  .chart{display:flex;align-items:flex-end;gap:20px;height:150px;padding:0 6px;
    border-bottom:1px solid var(--bd-l);}
  .bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;}
  .bar i{width:100%;max-width:34px;border-radius:5px 5px 0 0;display:block;
    background:linear-gradient(180deg,#79bbff,#409EFF);}
  .bar.peak i{background:linear-gradient(180deg,#ffc46b,#E6A23C);}
  .bar em{font-size:11px;color:var(--t3);font-style:normal;margin-top:8px;}

  .sug{border:1px solid var(--ai-line);border-radius:8px;padding:12px 14px;margin-bottom:10px;
    font-size:12.5px;line-height:1.75;color:var(--t2);position:relative;overflow:hidden;
    background:linear-gradient(135deg,#f6faff,#faf7ff);}
  .sug::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
    background:linear-gradient(180deg,var(--ai-a),var(--ai-b));}
  .sug b{color:var(--t1);}
  .sug .lbl{display:inline-block;width:62px;color:var(--t3);font-size:11.5px;}
  .sug .bar-anim{position:absolute;left:0;bottom:0;height:2px;width:100%;
    background:linear-gradient(90deg,var(--ai-a),var(--ai-b),var(--ai-a));
    background-size:200% 100%;animation:gradientMove 2.6s linear infinite;}

  /* ---------- 巡检 ---------- */
  .imgbox{height:296px;border-radius:9px;position:relative;overflow:hidden;
    background:linear-gradient(140deg,#eef2f8,#e3eaf4);border:1px solid var(--bd-l);}
  .imgbox .cam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    flex-direction:column;gap:9px;color:#a8b6c9;font-size:12.5px;}
  .imgbox .cam span{font-size:44px;opacity:.6;}
  .imgbox .scanline{position:absolute;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#409EFF,transparent);
    box-shadow:0 0 16px rgba(64,158,255,.8);animation:scanY 2.8s linear infinite;}
  .bbox{position:absolute;left:25%;top:24%;width:45%;height:52%;
    border:2px solid var(--success);border-radius:6px;
    box-shadow:0 0 0 4px rgba(103,194,58,.14);}
  .bbox::after{content:"投影仪 P-02 · 灯泡老化 92%";position:absolute;top:-24px;left:-2px;
    font-size:11.5px;background:var(--success);color:#fff;padding:2px 9px;border-radius:5px;
    white-space:nowrap;}
  .bbox i{position:absolute;width:9px;height:9px;border:2px solid var(--success);}
  .bbox i:nth-child(1){left:-5px;top:-5px;border-right:0;border-bottom:0;}
  .bbox i:nth-child(2){right:-5px;top:-5px;border-left:0;border-bottom:0;}
  .bbox i:nth-child(3){left:-5px;bottom:-5px;border-right:0;border-top:0;}
  .bbox i:nth-child(4){right:-5px;bottom:-5px;border-left:0;border-top:0;}

  /* ================= 小程序 ================= */
  .mb-status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:13px;font-weight:600;background:#fff;}
  .mb-nav{height:47px;flex:none;display:flex;align-items:center;justify-content:space-between;
