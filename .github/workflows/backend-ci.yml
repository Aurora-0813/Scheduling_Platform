# ============================================================================
# 后端 CI（项目文档 8.7）
# ----------------------------------------------------------------------------
# 触发：推送到 main / develop，以及面向这两个分支的 PR。
#
# ⚠️ 关于文件位置（重要，别再挪回去）
# ----------------------------------------------------------------------------
# 本仓库是 monorepo（backend/ frontend/ miniprogram/ docs/），**GitHub Actions
# 只认仓库根目录下的 .github/workflows/** **。本文件原先放在
# backend/.github/workflows/ci.yml，那个位置 GitHub 从来不会读 —— 也就是说
# 这条流水线此前**一次都没跑过**。现在它在正确的位置，并且：
#   * 所有步骤默认在 backend/ 下执行（job 级 `defaults.run.working-directory`），
#     这样 backend/pytest.ini、backend/ruff.toml 才会被读到 —— 否则 pytest 从
#     仓库根启动，config 不生效，标记、路径、asyncio_mode 全都会变样；
#   * 与路径有关的输入（缓存 key、覆盖率产物）显式写成 backend/... 前缀，
#     因为它们的基准是仓库根，不受上面那条影响。
# 前端/小程序的流水线将来以并列 job 的形式加在本文件里，见文末。
#
# ⚠️ 为什么 CI 里不需要 .env、也不需要云库和 Redis
# ----------------------------------------------------------------------------
# 测试全部离线（决策见 docs/test.md）：SQLite 临时文件库 + 假 Redis +
# 内存令牌白名单，`tests/conftest.py` 在导入 app 之前就把 REDIS_ENABLED
# 等环境变量设好了，缺 `.env` 时 app.core.config 走默认值。
# 因此 CI **不需要**配置任何密钥 —— 这也意味着 CI 里跑不到真库，
# 真库联调仍按 docs/deploy.md 的步骤在隧道里由人执行。
# ============================================================================
name: 后端 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 允许手动触发（答辩前想确认一下流水线是否还是绿的）
  workflow_dispatch:

# 同一分支连续推送时取消上一次未跑完的任务，避免排队浪费
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest

    # 本 job 的每一条 `run` 都从 backend/ 起跑：
    #   * pytest 会读到 backend/pytest.ini（-m "not smoke"、--strict-markers、
    #     asyncio_mode=auto 全靠它）；
    #   * ruff 会读到 backend/ruff.toml（含 alembic/versions 的排除）；
    #   * `pip install -r requirements.lock` 里的相对路径也指向 backend/。
    # 换句话说：在仓库根直接跑 pytest / ruff，与在本目录跑**不是一回事**。
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python 3.11.9
        uses: actions/setup-python@v7
        with:
          # 与 conda 环境 smart_dev 保持一致（项目文档 3.6）
          python-version: "3.11.9"
          cache: pip
          # 相对**仓库根**，因此要带 backend/ 前缀
          # （不受上面 defaults.run.working-directory 影响）
          cache-dependency-path: backend/requirements.lock

      - name: 安装依赖（按全量锁定版本）
        # 用 requirements.lock 而不是 requirements.txt：CI 必须与本地
        # 完全一致的间接依赖版本，否则会出现「本地过、CI 挂」的幽灵问题。
        run: pip install -r requirements.lock

      - name: 安装开发工具
        # ruff / pre-commit 是**开发工具**，不属于项目文档 3.6 的运行期依赖，
        # 因此不写进 requirements.txt。两处版本号必须与仓库根
        # .pre-commit-config.yaml 里的 rev 一致，否则本地与 CI 的规则集会漂移。
        run: pip install ruff==0.16.9 pre-commit==4.6.2

      - name: ruff 检查
        run: ruff check --output-format=github .

      - name: ruff 格式检查
        # 只检查不改：CI 里改文件没有意义，需要格式化时本地跑 ruff format
        run: ruff format --check .

      - name: 检查是否误提交了凭证文件
        # 只跑这一条本地钩子（language: fail，不需要为它准备任何运行环境）。
        # 这是 CI 里最有价值的一项：`.env` 一旦进过历史，密钥就必须更换。
        #
        # 这一步**必须回仓库根跑**（覆盖 job 级的 working-directory）：
        # 配置文件与钩子规则都在根目录，且 `files:` 匹配的是相对仓库根的路径，
        # 从 backend/ 起跑会让规则匹配到另一套路径上，等于没检查。
        #
        # 它会联网：pre-commit 要 clone 配置里**所有**钩子仓库才能枚举出 hook id
        # （`all_hooks()` 的行为），哪怕本次只跑其中一条本地钩子。Actions 有网，
        # 不受影响；只是别指望这条在离线机器上跑得起来。
        working-directory: ${{ github.workspace }}
        run: pre-commit run no-secrets-file --all-files

      - name: 运行测试
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率报告
        # if: always() —— 测试失败时覆盖率报告更有排查价值
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          # 相对仓库根（pytest 是在 backend/ 下跑的）
          path: backend/coverage.xml
          if-no-files-found: ignore

# ============================================================================
# 前端 / 小程序的流水线（与上面的 job 并列加在本文件里）
# ----------------------------------------------------------------------------
# 项目文档 8.7 要求 PR 时也跑 `npm run lint` 与 `npm run build`。
# 前端与小程序在各自的目录里（见 8.5 的目录结构），按下面的形式补一个 job：
#
#   frontend:
#     name: 前端构建
#     runs-on: ubuntu-latest
#     defaults:
#       run:
#         working-directory: frontend
#     steps:
#       - uses: actions/checkout@v7
#       - uses: actions/setup-node@v4
#         with:
#           node-version: "20"
#           cache: npm
#           cache-dependency-path: frontend/package-lock.json
#       - run: npm ci
#       - run: npm run lint
#       - run: npm run build
#
# 对应的 eslint 钩子加在仓库根的 .pre-commit-config.yaml，用 `files: ^frontend/`
# 限定范围（写法见那份文件第 4 节）。
# ============================================================================
